[package]
name = "benchproof"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A bounded benchmark evidence and comparability harness"
license = "MIT"
repository = "https://github.com/joshiii-xyz/benchproof"
keywords = ["benchmark", "reproducibility", "evidence", "performance", "comparability"]
categories = ["command-line-utilities", "development-tools::profiling"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
